name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: JobNavigator ref to build (branch or release tag)
        default: main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check out JobNavigator
        uses: actions/checkout@v7
        with:
          repository: vesaias/JobNavigator
          ref: ${{ inputs.ref || 'main' }}
          path: jn

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # Until the demo hooks are in a JobNavigator release, a ref without them gets them from hooks.patch.
      - name: Add the demo hooks if the ref lacks them
        working-directory: jn
        run: |
          if [ ! -f frontend/src/demoHooks.js ]; then git apply "$GITHUB_WORKSPACE/hooks.patch"; fi

      - name: Add the demo layer
        run: |
          mkdir -p jn/frontend/src/demo
          cp -r layer/. jn/frontend/src/demo/
          cp layer-tests/* jn/frontend/src/__tests__/

      - name: Install
        working-directory: jn/frontend
        run: |
          npm install --no-audit --no-fund --no-package-lock
          npm install --no-save --no-audit --no-fund --no-package-lock nunjucks@3.2.4 html2canvas@1.4.1 jspdf@3.0.1 docx@8.5.0

      - name: Test the layer
        working-directory: jn/frontend
        run: TZ=UTC npx vitest run src/__tests__/demo

      - name: Build
        working-directory: jn/frontend
        run: VITE_DEMO=1 npx vite build

      - name: Add the data
        run: |
          mkdir -p jn/frontend/dist/demo-data
          cp -r data/. jn/frontend/dist/demo-data/
          cp jn/frontend/dist/index.html jn/frontend/dist/404.html

      - uses: actions/upload-pages-artifact@v5
        with:
          path: jn/frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
